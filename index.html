<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Wall Magazine & Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: #0f172a;
      --panel-border: #1e293b;
      --card-bg: #1e293b;
      --card-hover: #2d3d54;
      --accent-cyan: #00f2fe;
      --accent-magenta: #f43f5e;
      --accent-yellow: #fbbf24;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Header Bar */
    header {
      background: #090e1a;
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .header-title h1 {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .header-title p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .select-dropdown, .btn {
      background: #182238;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .select-dropdown:focus, .btn:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn.active {
      background: var(--accent-cyan);
      color: #070b14;
      border-color: var(--accent-cyan);
      font-weight: 700;
    }

    /* Main Workspace Layout */
    .app-workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Expanded Sidebar Panel */
    .dashboard {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    /* Clickable Tab Navigation Header */
    .sidebar-tabs {
      display: flex;
      background: #090e1a;
      border-bottom: 1px solid var(--panel-border);
    }

    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
      background: #0f172a;
    }

    .sidebar-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-scroll-area::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll-area::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards Styling */
    .article-card, .contributor-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .article-card:hover, .contributor-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateX(4px);
    }

    .contributor-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .contributor-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
    }

    .contributor-info h5 {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .contributor-info p {
      margin: 2px 0 0;
      font-size: 0.75rem;
      color: var(--accent-yellow);
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .badge-art { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid #f43f5e; }
    .badge-research { background: rgba(0, 242, 254, 0.2); color: #00f2fe; border: 1px solid #00f2fe; }

    /* Stage Canvas Viewport */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #03060d;
    }

    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .canvas-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
    }

    .board-img {
      max-height: calc(100vh - 100px);
      max-width: 100%;
      object-fit: contain;
      display: block;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    /* Magnifier Lens */
    .magnifier-lens {
      position: absolute;
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      width: 200px;
      height: 200px;
      display: none;
      pointer-events: none;
      background-repeat: no-repeat;
      z-index: 50;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    /* Modal Dialogs */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 6, 13, 0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-card-modal {
      background: #0f172a;
      border: 2px solid var(--accent-cyan);
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      position: relative;
    }

    .profile-card-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 16px;
    }

    .profile-card-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-cyan);
    }

    .profile-card-details h2 {
      margin: 0 0 4px;
      font-size: 1.2rem;
      font-family: 'Outfit', sans-serif;
    }

    .profile-card-details .role-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .modal-close-btn {
      position: absolute;
      top: 16px; right: 16px;
      background: #182238;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .reader-drawer {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 380px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 20px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- Top Application Bar -->
  <header>
    <div class="header-title">
      <h1 id="magazineHeader">LOADING DIGITAL MAGAZINE...</h1>
      <p>Department of Zoology — Interactive Wall Magazine System</p>
    </div>

    <div class="header-controls">
      <select id="yearSelect" class="select-dropdown" onchange="loadMagazineEdition(this.value)"></select>
      <button class="btn" id="modeBtn" onclick="toggleMode()">🔍 Mode: Lens & Overlays</button>
      <button class="btn" onclick="closeAllModals()">🔄 Reset View</button>
    </div>
  </header>

  <div class="app-workspace">
    <!-- Sidebar Area with TAB Navigation -->
    <aside class="dashboard">
      <div class="sidebar-tabs">
        <button class="tab-btn active" id="tabArticlesBtn" onclick="switchSidebarTab('articles')">📰 Articles</button>
        <button class="tab-btn" id="tabContributorsBtn" onclick="switchSidebarTab('contributors')">👥 Team & Staff</button>
      </div>

      <div class="sidebar-scroll-area">
        <!-- Articles Tab Content -->
        <div id="articlesTab" class="tab-content active">
          <div id="articleList"></div>
        </div>

        <!-- Student Team & Contributors Tab Content -->
        <div id="contributorsTab" class="tab-content">
          <div id="contributorList"></div>
        </div>
      </div>
    </aside>

    <!-- Canvas Stage -->
    <div class="stage-container">
      <main class="stage" id="stage">
        <div class="canvas-container" id="canvasContainer">
          <img id="boardImg" class="board-img" src="" alt="Wall Magazine Canvas">
        </div>
        <div id="lens" class="magnifier-lens"></div>
      </main>
    </div>
  </div>

  <!-- Contributor Modal -->
  <div class="modal-backdrop" id="studentModalBackdrop">
    <div class="profile-card-modal">
      <div class="modal-close-btn" onclick="closeStudentModal()">&times;</div>
      <div class="profile-card-header">
        <img id="modalStudentAvatar" class="profile-card-avatar" src="" alt="Student Profile">
        <div class="profile-card-details">
          <h2 id="modalStudentName">Student Name</h2>
          <span id="modalStudentRole" class="role-badge">Lead Contributor</span>
        </div>
      </div>
      <p id="modalStudentBio" style="font-size: 0.85rem; color: var(--text-sub); line-height: 1.4;"></p>
    </div>
  </div>

  <!-- Article Drawer Modal -->
  <div class="reader-drawer" id="readerDrawer">
    <div class="modal-close-btn" onclick="closeDrawer()">&times;</div>
    <h3 id="modalTitle" style="color:var(--accent-cyan); margin-top:0;">Article Title</h3>
    <p id="modalBody" style="font-size:0.88rem; line-height:1.5; color:var(--text-sub);">Body text...</p>
    <div style="font-size:0.8rem; color:var(--text-muted);">
      <strong>Contributor:</strong> <span id="modalAuthor">Student Name</span>
    </div>
  </div>

  <script>
    let magazineData = null;
    let activeMode = "pointer";

    const stage = document.getElementById('stage');
    const container = document.getElementById('canvasContainer');
    const img = document.getElementById('boardImg');
    const lens = document.getElementById('lens');

    async function initApp() {
      try {
        const response = await fetch('./config.json');
        magazineData = await response.json();

        const yearSelect = document.getElementById('yearSelect');
        Object.keys(magazineData.editions).forEach(year => {
          const opt = document.createElement('option');
          opt.value = year;
          opt.innerText = `${year} Edition`;
          yearSelect.appendChild(opt);
        });

        loadMagazineEdition(magazineData.defaultEdition);
      } catch (err) {
        console.error("Initialization Error:", err);
      }
    }

    function switchSidebarTab(tabName) {
      const articlesTab = document.getElementById('articlesTab');
      const contributorsTab = document.getElementById('contributorsTab');
      const tabArticlesBtn = document.getElementById('tabArticlesBtn');
      const tabContributorsBtn = document.getElementById('tabContributorsBtn');

      if (tabName === 'articles') {
        articlesTab.classList.add('active');
        contributorsTab.classList.remove('active');
        tabArticlesBtn.classList.add('active');
        tabContributorsBtn.classList.remove('active');
      } else {
        contributorsTab.classList.add('active');
        articlesTab.classList.remove('active');
        tabContributorsBtn.classList.add('active');
        tabArticlesBtn.classList.remove('active');
      }
    }

    function loadMagazineEdition(year) {
      const edition = magazineData.editions[year];
      document.getElementById('magazineHeader').innerText = edition.header;
      img.src = edition.imgSrc;

      renderArticles(edition.articles);
      renderContributors(edition.contributors || []);
    }

    function renderArticles(articles) {
      const list = document.getElementById('articleList');
      list.innerHTML = "";
      articles.forEach(art => {
        const card = document.createElement('div');
        card.className = "article-card";
        card.onclick = () => openArticle(art);
        card.innerHTML = `
          <span class="badge badge-research">${art.category}</span>
          <h4 style="margin:4px 0; font-size:0.9rem;">${art.title}</h4>
          <p style="font-size:0.78rem; color:var(--text-sub); margin:0;">By ${art.author}</p>
        `;
        list.appendChild(card);
      });
    }

    function renderContributors(contributors) {
      const list = document.getElementById('contributorList');
      list.innerHTML = "";
      contributors.forEach(c => {
        const card = document.createElement('div');
        card.className = "contributor-card";
        card.onclick = () => openStudentModal(c);
        card.innerHTML = `
          <img class="contributor-avatar" src="${c.photo}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/42'">
          <div class="contributor-info">
            <h5>${c.name}</h5>
            <p>${c.role}</p>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openStudentModal(student) {
      document.getElementById('modalStudentName').innerText = student.name;
      document.getElementById('modalStudentRole').innerText = student.role;
      document.getElementById('modalStudentBio').innerText = student.bio || "Key editorial team member contributing to the department wall magazine.";
      
      const avatar = document.getElementById('modalStudentAvatar');
      avatar.src = student.photo;
      avatar.onerror = () => avatar.src = 'https://via.placeholder.com/70';

      document.getElementById('studentModalBackdrop').style.display = 'flex';
    }

    function closeStudentModal() {
      document.getElementById('studentModalBackdrop').style.display = 'none';
    }

    stage.addEventListener('mousemove', (e) => {
      if (activeMode !== "lens") return;
      const stageRect = stage.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const x = e.clientX - stageRect.left;
      const y = e.clientY - stageRect.top;

      lens.style.display = 'block';
      lens.style.left = (x - 100) + 'px';
      lens.style.top = (y - 100) + 'px';

      const zoom = 2.2;
      const bgX = -((e.clientX - containerRect.left) * zoom - 100);
      const bgY = -((e.clientY - containerRect.top) * zoom - 100);

      lens.style.backgroundImage = `url('${img.src}')`;
      lens.style.backgroundSize = `${containerRect.width * zoom}px ${containerRect.height * zoom}px`;
      lens.style.backgroundPosition = `${bgX}px ${bgY}px`;
    });

    stage.addEventListener('mouseleave', () => lens.style.display = 'none');

    function toggleMode() {
      activeMode = activeMode === "pointer" ? "lens" : "pointer";
      const btn = document.getElementById('modeBtn');
      btn.innerText = activeMode === "lens" ? "🔍 Mode: Lens ON" : "🏹 Mode: Pointer Mode";
      btn.classList.toggle('active', activeMode === "lens");
      if (activeMode !== "lens") lens.style.display = 'none';
    }

    function openArticle(art) {
      document.getElementById('modalTitle').innerText = art.title;
      document.getElementById('modalBody').innerText = art.body;
      document.getElementById('modalAuthor').innerText = art.author;
      document.getElementById('readerDrawer').style.display = 'block';
    }

    function closeDrawer() {
      document.getElementById('readerDrawer').style.display = 'none';
    }

    function closeAllModals() {
      closeDrawer();
      closeStudentModal();
    }

    initApp();
  </script>
</body>
</html>
