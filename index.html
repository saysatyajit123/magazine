<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Wall Magazine & Student Contributors Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: #0f172a;
      --panel-border: #1e293b;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent-cyan: #00f2fe;
      --accent-magenta: #f43f5e;
      --accent-yellow: #fbbf24;
      --accent-glow: rgba(0, 242, 254, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: #0b1120;
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .header-title h1 {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .header-title p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .select-dropdown, .btn {
      background: #182238;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .select-dropdown:focus, .btn:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn.active {
      background: var(--accent-cyan);
      color: #070b14;
      border-color: var(--accent-cyan);
      font-weight: 700;
    }

    /* Main Application Layout */
    .app-workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .dashboard {
      width: 410px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .tab-bar {
      display: flex;
      background: #090e1a;
      border-bottom: 1px solid var(--panel-border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
      background: #111a2e;
    }

    .content-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Article Card Styles */
    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .article-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .badge-art { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid #f43f5e; }
    .badge-research { background: rgba(0, 242, 254, 0.2); color: #00f2fe; border: 1px solid #00f2fe; }

    /* Student Contributor Card Styles */
    .student-card {
      display: flex;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .student-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      background: #090e1a;
    }

    .student-info h4 {
      margin: 0 0 2px;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .student-info .role {
      font-size: 0.75rem;
      color: var(--accent-yellow);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .student-info .work {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* Stage Canvas Workspace */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #03060d;
    }

    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas-container {
      position: relative;
      display: inline-block;
    }

    .board-img {
      max-width: 920px;
      width: 65vw;
      display: block;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }

    /* Bottom Student Credits Bar */
    .credits-bar {
      height: 85px;
      background: #0a101f;
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      overflow-x: auto;
    }

    .credits-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .credits-flex {
      display: flex;
      gap: 14px;
    }

    .credit-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #141e33;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
      white-space: nowrap;
    }

    .chip-img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chip-text {
      font-size: 0.78rem;
    }

    /* Section Overlays & Lens */
    .section-overlay-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 25;
      display: none;
    }

    .article-overlay-box {
      position: absolute;
      border: 2px dashed var(--accent-cyan);
      background: rgba(0, 242, 254, 0.12);
      border-radius: 6px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 10px;
      cursor: pointer;
      pointer-events: auto;
    }

    .overlay-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      background: rgba(11, 17, 32, 0.85);
      padding: 2px 6px;
      border-radius: 3px;
      width: max-content;
    }

    .magnifier-lens {
      position: absolute;
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      width: 200px;
      height: 200px;
      display: none;
      pointer-events: none;
      background-repeat: no-repeat;
      z-index: 50;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    /* Article Reader Modal Drawer */
    .reader-drawer {
      position: fixed;
      bottom: 100px;
      right: 24px;
      width: 400px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 20px;
      display: none;
      z-index: 100;
    }

    .close-btn {
      float: right;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="header-title">
      <h1 id="magazineHeader">LOADING DIGITAL MAGAZINE...</h1>
      <p>Department of Zoology — Interactive Student Wall Magazine</p>
    </div>

    <div class="header-controls">
      <select id="yearSelect" class="select-dropdown" onchange="loadMagazineEdition(this.value)"></select>
      <button class="btn" id="modeBtn" onclick="toggleMode()">🔍 Mode: Lens & Overlays</button>
      <button class="btn" onclick="closeDrawer()">🔄 Reset View</button>
    </div>
  </header>

  <!-- Main Body Grid -->
  <div class="app-workspace">
    <!-- Sidebar Index & Student Roster -->
    <aside class="dashboard">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabArticles" onclick="switchTab('articles')">📰 Articles</button>
        <button class="tab-btn" id="tabStudents" onclick="switchTab('students')">🎓 Student Team</button>
      </div>

      <div class="content-list" id="articlesTab">
        <div id="articleList"></div>
      </div>

      <div class="content-list" id="studentsTab" style="display: none;">
        <div id="studentList"></div>
      </div>
    </aside>

    <!-- Canvas & Credits Section -->
    <div class="stage-container">
      <main class="stage" id="stage">
        <div class="canvas-container" id="canvasContainer">
          <img id="boardImg" class="board-img" src="" alt="Wall Magazine Canvas">
          <div id="overlayLayer" class="section-overlay-layer"></div>
        </div>

        <div id="lens" class="magnifier-lens"></div>
      </main>

      <!-- Bottom Credits Roster -->
      <div class="credits-bar">
        <div class="credits-label">Contributors:</div>
        <div class="credits-flex" id="creditsFlex"></div>
      </div>
    </div>
  </div>

  <!-- Reader Modal -->
  <div class="reader-drawer" id="readerDrawer">
    <span class="close-btn" onclick="closeDrawer()">&times;</span>
    <h3 id="modalTitle" style="color:var(--accent-cyan); margin-top:0;">Article Title</h3>
    <p id="modalBody" style="font-size:0.88rem; line-height:1.5; color:var(--text-sub);">Body text...</p>
    <div style="font-size:0.8rem; color:var(--text-muted);">
      <strong>Contributor:</strong> <span id="modalAuthor">Student Name</span>
    </div>
  </div>

  <script>
    let magazineData = null;
    let activeMode = "pointer";

    const stage = document.getElementById('stage');
    const container = document.getElementById('canvasContainer');
    const img = document.getElementById('boardImg');
    const lens = document.getElementById('lens');
    const overlayLayer = document.getElementById('overlayLayer');

    /* Fetch Configuration Data */
    async function initApp() {
      try {
        const response = await fetch('./config.json');
        magazineData = await response.json();

        const yearSelect = document.getElementById('yearSelect');
        Object.keys(magazineData.editions).forEach(year => {
          const opt = document.createElement('option');
          opt.value = year;
          opt.innerText = `${year} Edition`;
          yearSelect.appendChild(opt);
        });

        loadMagazineEdition(magazineData.defaultEdition);
      } catch (err) {
        console.error("Initialization Error:", err);
      }
    }

    /* Load Selected Edition */
    function loadMagazineEdition(year) {
      const edition = magazineData.editions[year];
      document.getElementById('magazineHeader').innerText = edition.header;
      img.src = edition.imgSrc;

      renderArticles(edition.articles);
      renderStudents(edition.contributors || []);
      renderCreditsBar(edition.contributors || []);
      renderOverlays(edition.articles);
    }

    /* Render Sidebar Articles */
    function renderArticles(articles) {
      const list = document.getElementById('articleList');
      list.innerHTML = "";
      articles.forEach(art => {
        const card = document.createElement('div');
        card.className = "article-card";
        card.onclick = () => openArticle(art);
        card.innerHTML = `
          <span class="badge badge-research">${art.category}</span>
          <h4 style="margin:4px 0;">${art.title}</h4>
          <p style="font-size:0.8rem; color:var(--text-sub); margin:0;">By ${art.author}</p>
        `;
        list.appendChild(card);
      });
    }

    /* Render Student Contributors Tab */
    function renderStudents(contributors) {
      const list = document.getElementById('studentList');
      list.innerHTML = "";
      contributors.forEach(c => {
        const card = document.createElement('div');
        card.className = "student-card";
        card.innerHTML = `
          <img class="student-avatar" src="${c.photo}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/56'">
          <div class="student-info">
            <h4>${c.name}</h4>
            <div class="role">${c.role}</div>
            <div class="work">Contribution: ${c.work}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    /* Render Bottom Student Credits Bar */
    function renderCreditsBar(contributors) {
      const flex = document.getElementById('creditsFlex');
      flex.innerHTML = "";
      contributors.forEach(c => {
        const chip = document.createElement('div');
        chip.className = "credit-chip";
        chip.innerHTML = `
          <img class="chip-img" src="${c.photo}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/28'">
          <div class="chip-text">
            <strong>${c.name}</strong> (${c.role})
          </div>
        `;
        flex.appendChild(chip);
      });
    }

    /* Render Article Overlay Layers */
    function renderOverlays(articles) {
      overlayLayer.innerHTML = "";
      articles.forEach(art => {
        const box = document.createElement('div');
        box.className = "article-overlay-box";
        box.style.top = art.coords.top;
        box.style.left = art.coords.left;
        box.style.width = art.coords.width;
        box.style.height = art.coords.height;
        box.onclick = () => openArticle(art);
        box.innerHTML = `
          <span class="overlay-label">${art.category}</span>
          <span class="overlay-label" style="color:var(--accent-cyan); font-size:0.65rem;">${art.title}</span>
        `;
        overlayLayer.appendChild(box);
      });
    }

    /* Tab Switcher */
    function switchTab(tab) {
      document.getElementById('articlesTab').style.display = tab === 'articles' ? 'block' : 'none';
      document.getElementById('studentsTab').style.display = tab === 'students' ? 'block' : 'none';
      document.getElementById('tabArticles').classList.toggle('active', tab === 'articles');
      document.getElementById('tabStudents').classList.toggle('active', tab === 'students');
    }

    /* Lens Magnifier Controller */
    stage.addEventListener('mousemove', (e) => {
      if (activeMode !== "lens") return;
      const stageRect = stage.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const x = e.clientX - stageRect.left;
      const y = e.clientY - stageRect.top;

      lens.style.display = 'block';
      lens.style.left = (x - 100) + 'px';
      lens.style.top = (y - 100) + 'px';

      const zoom = 2.2;
      const bgX = -((e.clientX - containerRect.left) * zoom - 100);
      const bgY = -((e.clientY - containerRect.top) * zoom - 100);

      lens.style.backgroundImage = `url('${img.src}')`;
      lens.style.backgroundSize = `${containerRect.width * zoom}px ${containerRect.height * zoom}px`;
      lens.style.backgroundPosition = `${bgX}px ${bgY}px`;
    });

    stage.addEventListener('mouseleave', () => lens.style.display = 'none');

    function toggleMode() {
      activeMode = activeMode === "pointer" ? "lens" : "pointer";
      const btn = document.getElementById('modeBtn');
      overlayLayer.style.display = activeMode === "lens" ? "block" : "none";
      btn.innerText = activeMode === "lens" ? "🔍 Mode: Lens & Overlays ON" : "🏹 Mode: Pointer Mode";
      btn.classList.toggle('active', activeMode === "lens");
      if (activeMode !== "lens") lens.style.display = 'none';
    }

    function openArticle(art) {
      document.getElementById('modalTitle').innerText = art.title;
      document.getElementById('modalBody').innerText = art.body;
      document.getElementById('modalAuthor').innerText = art.author;
      document.getElementById('readerDrawer').style.display = 'block';
    }

    function closeDrawer() {
      document.getElementById('readerDrawer').style.display = 'none';
    }

    initApp();
  </script>
</body>
</html>
