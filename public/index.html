<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digital Wall Magazine &amp; Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: #0f172a;
      --panel-border: #1e293b;
      --card-bg: #1e293b;
      --card-hover: #2d3d54;
      --accent-cyan: #00f2fe;
      --accent-magenta: #f43f5e;
      --accent-yellow: #fbbf24;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;
      --lens-size: 200px;
      --stage-pad: 16px;
      --header-h: 76px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    header {
      background: #090e1a;
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .header-title { min-width: 0; }

    .header-title h1 {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-cyan);
      overflow-wrap: anywhere;
    }

    .header-title p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .select-dropdown, .btn {
      background: #182238;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .select-dropdown:focus, .btn:hover, .btn:focus-visible {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn.active {
      background: var(--accent-cyan);
      color: #070b14;
      border-color: var(--accent-cyan);
      font-weight: 700;
    }

    /* ---------- Workspace ---------- */
    .app-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .dashboard {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 20;
      flex-shrink: 0;
      min-height: 0;
    }

    .sidebar-tabs {
      display: flex;
      background: #090e1a;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.02); }

    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
      background: #0f172a;
    }

    .sidebar-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar-scroll-area::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll-area::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .article-card, .contributor-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .article-card:hover, .contributor-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateX(4px);
    }

    .article-card h4 { margin: 4px 0; font-size: 0.9rem; }
    .article-card p { font-size: 0.78rem; color: var(--text-sub); margin: 0; }

    .contributor-card { display: flex; align-items: center; gap: 14px; }

    .contributor-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      background: #090e1a;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
    }

    .contributor-info h5 { margin: 0; font-size: 0.9rem; color: var(--text-main); line-height: 1.2; }
    .contributor-info p { margin: 3px 0 0; font-size: 0.76rem; color: var(--accent-yellow); }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      background: rgba(0, 242, 254, 0.2);
      color: #00f2fe;
      border: 1px solid #00f2fe;
    }

    /* ---------- Stage ---------- */
    .stage-container {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #03060d;
      overflow: hidden;
    }

    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--stage-pad);
      -webkit-overflow-scrolling: touch;
    }

    .stage.lens-on { cursor: crosshair; touch-action: none; }

    .canvas-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: auto;
    }

    .board-img {
      max-height: calc(100dvh - var(--header-h) - (var(--stage-pad) * 2));
      max-width: 100%;
      object-fit: contain;
      display: block;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      user-select: none;
      -webkit-user-drag: none;
    }

    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      border: 2px dashed var(--accent-cyan);
      background: rgba(0, 242, 254, 0.12);
      border-radius: 6px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .hotspot:hover, .hotspot:focus-visible, .hotspot.selected {
      background: rgba(0, 242, 254, 0.35);
      border-style: solid;
      box-shadow: 0 0 15px var(--accent-glow);
      outline: none;
      z-index: 15;
    }

    .hotspot-label {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #070b14;
      color: var(--accent-cyan);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--accent-cyan);
      white-space: nowrap;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .magnifier-lens {
      position: absolute;
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      width: var(--lens-size);
      height: var(--lens-size);
      display: none;
      pointer-events: none;
      background-repeat: no-repeat;
      background-color: #03060d;
      z-index: 50;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    /* ---------- Modals ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 13, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-card-modal {
      background: #0f172a;
      border: 2px solid var(--accent-cyan);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 100%;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
      position: relative;
    }

    .profile-card-header {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 16px;
    }

    .passport-photo-frame {
      position: relative;
      width: 140px;
      height: 165px;
      border-radius: 8px;
      border: 2px solid var(--accent-cyan);
      padding: 4px;
      background: #090e1a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .profile-passport-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .profile-card-details { flex: 1; min-width: 0; padding-top: 2px; padding-right: 30px; }

    .profile-card-details h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
    }

    .role-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .profile-card-details .dept { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .profile-card-details .work-title { font-size: 0.82rem; color: var(--accent-cyan); font-weight: 600; }

    .about-title { margin: 0 0 6px; font-size: 0.78rem; color: var(--accent-cyan); text-transform: uppercase; }
    .about-text { font-size: 0.85rem; color: var(--text-sub); line-height: 1.4; margin: 0; }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #182238;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1;
      transition: all 0.2s;
      z-index: 2;
    }

    .modal-close-btn:hover { color: var(--accent-magenta); border-color: var(--accent-magenta); }

    .reader-drawer {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 380px;
      max-height: calc(100dvh - 48px);
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 20px;
      display: none;
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .reader-drawer h3 { color: var(--accent-cyan); margin: 0 36px 10px 0; font-family: 'Outfit', sans-serif; }
    .reader-drawer .body { font-size: 0.88rem; line-height: 1.5; color: var(--text-sub); margin: 0 0 12px; }
    .reader-drawer .meta { font-size: 0.8rem; color: var(--text-muted); }

    /* ---------- Laptop / small laptop ---------- */
    @media (max-width: 1024px) {
      .dashboard { width: 270px; }
      header { padding: 10px 16px; }
      .header-title h1 { font-size: 1.1rem; }
    }

    /* ---------- Mobile: whole page scrolls (image first, then articles / team) ---------- */
    @media (max-width: 768px) {
      :root { --lens-size: 140px; --stage-pad: 10px; }

      html, body { height: auto; }

      body {
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 10px 12px;
        padding-top: max(10px, env(safe-area-inset-top));
      }

      .header-title h1 { font-size: 0.95rem; line-height: 1.25; }
      .header-title p { display: none; }

      .header-controls { width: 100%; flex-shrink: 1; gap: 8px; }
      .header-controls .select-dropdown { flex: 1; min-width: 0; }
      .header-controls .btn { flex: 1; padding: 9px 8px; font-size: 0.78rem; }
      .select-dropdown, .btn { min-height: 40px; }

      .app-workspace {
        flex: none;
        flex-direction: column;
        overflow: visible;
      }

      .stage-container {
        order: -1;
        flex: none;
        height: auto;
        overflow: visible;
        border-bottom: 1px solid var(--panel-border);
      }

      .stage {
        flex: none;
        overflow: visible;
        display: block;
        padding: var(--stage-pad);
      }

      .canvas-container { display: block; width: 100%; margin: 0; }

      .board-img { width: 100%; height: auto; max-height: none; }

      .dashboard {
        order: 1;
        width: 100%;
        flex: none;
        overflow: visible;
        border-right: none;
      }

      .sidebar-tabs { position: sticky; top: 0; z-index: 30; }
      .tab-btn { padding: 12px 8px; }

      .sidebar-scroll-area {
        flex: none;
        overflow: visible;
        padding: 12px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }

      .article-card:hover, .contributor-card:hover { transform: none; }

      .hotspot-label { display: none; }

      .modal-backdrop { padding: 12px; }
      .profile-card-modal { padding: 18px; max-height: 92dvh; }
      .profile-card-header { flex-direction: column; align-items: center; text-align: center; }
      .profile-card-details { padding-right: 0; }

      .reader-drawer {
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-height: 60dvh;
        border-radius: 16px 16px 0 0;
        border-width: 1px 0 0;
        padding: 18px 16px;
        padding-bottom: max(18px, env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 380px) {
      .header-controls .btn { font-size: 0.72rem; padding: 9px 4px; }
    }
  </style>
</head>
<body>

  <header id="appHeader">
    <div class="header-title">
      <h1 id="magazineHeader">LOADING DIGITAL MAGAZINE...</h1>
      <p>Department of Zoology — Interactive Wall Magazine System</p>
    </div>

    <div class="header-controls">
      <select id="yearSelect" class="select-dropdown" aria-label="Edition"></select>
      <button class="btn" id="modeBtn" type="button">🔍 Lens: Off</button>
      <button class="btn" id="resetBtn" type="button">🔄 Reset View</button>
    </div>
  </header>

  <div class="app-workspace">
    <aside class="dashboard">
      <div class="sidebar-tabs" role="tablist">
        <button class="tab-btn active" id="tabArticlesBtn" type="button" role="tab" data-tab="articles">📰 Articles</button>
        <button class="tab-btn" id="tabContributorsBtn" type="button" role="tab" data-tab="contributors">👥 Team &amp; Staff</button>
      </div>

      <div class="sidebar-scroll-area">
        <div id="articlesTab" class="tab-content active"><div id="articleList"></div></div>
        <div id="contributorsTab" class="tab-content"><div id="contributorList"></div></div>
      </div>
    </aside>

    <div class="stage-container">
      <main class="stage" id="stage">
        <div class="canvas-container" id="canvasContainer">
          <img id="boardImg" class="board-img" src="" alt="Wall Magazine Canvas" draggable="false">
          <div id="overlayLayer" class="overlay-layer"></div>
        </div>
        <div id="lens" class="magnifier-lens"></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="studentModalBackdrop">
    <div class="profile-card-modal" role="dialog" aria-modal="true" aria-labelledby="modalStudentName">
      <button class="modal-close-btn" id="studentCloseBtn" type="button" aria-label="Close">&times;</button>

      <div class="profile-card-header">
        <div class="passport-photo-frame">
          <img id="modalStudentAvatar" class="profile-passport-photo" src="" alt="Student photo">
        </div>

        <div class="profile-card-details">
          <h2 id="modalStudentName">Student Name</h2>
          <span id="modalStudentRole" class="role-badge">Lead Contributor</span>
          <div id="modalStudentDept" class="dept">Department of Zoology</div>
          <div id="modalStudentWork" class="work-title"></div>
        </div>
      </div>

      <div>
        <h4 class="about-title">About Contributor</h4>
        <p id="modalStudentBio" class="about-text"></p>
      </div>
    </div>
  </div>

  <div class="reader-drawer" id="readerDrawer" role="dialog" aria-labelledby="modalTitle">
    <button class="modal-close-btn" id="drawerCloseBtn" type="button" aria-label="Close">&times;</button>
    <h3 id="modalTitle">Article Title</h3>
    <p class="body" id="modalBody"></p>
    <div class="meta"><strong>Contributor:</strong> <span id="modalAuthor"></span></div>
  </div>

  <script>
    (function () {
      'use strict';

      const $ = (id) => document.getElementById(id);

      const stage = $('stage');
      const container = $('canvasContainer');
      const img = $('boardImg');
      const overlayLayer = $('overlayLayer');
      const lens = $('lens');
      const modeBtn = $('modeBtn');
      const yearSelect = $('yearSelect');

      const PLACEHOLDER = (w, h, label) =>
        'data:image/svg+xml;utf8,' + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">` +
          `<rect width="100%" height="100%" fill="#182238"/>` +
          `<text x="50%" y="50%" fill="#94a3b8" font-family="sans-serif" font-size="${Math.max(10, w / 9)}" ` +
          `text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`
        );

      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

      let magazineData = null;
      let lensMode = false;
      let selectedHotspot = null;

      function getPhotoUrl(person, w, h) {
        const raw = person && (person.photo || person.img || person.image || person.avatar || person.src);
        if (!raw) return PLACEHOLDER(w, h, 'No Photo');
        if (/^(https?:|data:)/i.test(raw)) return raw;
        return './' + raw.replace(/^(\.\/|\/)/, '');
      }

      /* ---------- Data ---------- */
      async function initApp() {
        try {
          const response = await fetch('./config.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          magazineData = await response.json();

          const years = Object.keys(magazineData.editions || {});
          years.forEach((year) => {
            const opt = document.createElement('option');
            opt.value = year;
            opt.textContent = year + ' Edition';
            yearSelect.appendChild(opt);
          });
          yearSelect.hidden = years.length < 2;

          const initial = years.includes(magazineData.defaultEdition) ? magazineData.defaultEdition : years[0];
          yearSelect.value = initial;
          loadMagazineEdition(initial);
        } catch (err) {
          console.error('Initialization error:', err);
          $('magazineHeader').textContent = 'UNABLE TO LOAD MAGAZINE DATA';
        }
      }

      function loadMagazineEdition(year) {
        const edition = magazineData.editions[year];
        if (!edition) return;
        $('magazineHeader').textContent = edition.header || 'Digital Wall Magazine';
        img.src = edition.imgSrc ? './' + edition.imgSrc.replace(/^(\.\/|\/)/, '') : '/image';

        const articles = edition.articles || [];
        renderArticles(articles);
        renderContributors(edition.contributors || edition.team || []);
        renderOverlays(articles);
        closeAllModals();
      }

      /* ---------- Rendering ---------- */
      function renderArticles(articles) {
        const list = $('articleList');
        list.innerHTML = '';
        articles.forEach((art) => {
          const card = document.createElement('div');
          card.className = 'article-card';
          card.tabIndex = 0;
          card.innerHTML =
            `<span class="badge">${esc(art.category || art.type || 'Article')}</span>` +
            `<h4>${esc(art.title)}</h4>` +
            `<p>By ${esc(art.author || 'Contributor')}</p>`;
          const open = () => { openArticle(art); highlightHotspot(art.id, true); };
          card.addEventListener('click', open);
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
          list.appendChild(card);
        });
      }

      function renderContributors(contributors) {
        const list = $('contributorList');
        list.innerHTML = '';
        contributors.forEach((c) => {
          const card = document.createElement('div');
          card.className = 'contributor-card';
          card.tabIndex = 0;
          card.innerHTML =
            `<img class="contributor-avatar" src="${esc(getPhotoUrl(c, 48, 48))}" alt="${esc(c.name)}">` +
            `<div class="contributor-info"><h5>${esc(c.name)}</h5><p>${esc(c.role)}</p></div>`;
          card.querySelector('img').addEventListener('error', function () {
            this.onerror = null;
            this.src = PLACEHOLDER(48, 48, 'User');
          });
          const open = () => openStudentModal(c);
          card.addEventListener('click', open);
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
          list.appendChild(card);
        });
      }

      function renderOverlays(articles) {
        overlayLayer.innerHTML = '';
        articles.forEach((item) => {
          if (!item.coords) return;
          const elem = document.createElement('div');
          elem.className = 'hotspot';
          elem.dataset.id = item.id || '';
          elem.tabIndex = 0;
          elem.setAttribute('role', 'button');
          elem.setAttribute('aria-label', item.title || 'Article');
          elem.style.top = item.coords.top;
          elem.style.left = item.coords.left;
          elem.style.width = item.coords.width;
          elem.style.height = item.coords.height;

          const label = document.createElement('span');
          label.className = 'hotspot-label';
          label.textContent = item.title;
          elem.appendChild(label);

          const open = (e) => {
            e.stopPropagation();
            openArticle(item);
            highlightHotspot(item.id, false);
          };
          elem.addEventListener('click', open);
          elem.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); } });
          overlayLayer.appendChild(elem);
        });
      }

      function highlightHotspot(id, scrollIntoView) {
        if (selectedHotspot) selectedHotspot.classList.remove('selected');
        selectedHotspot = null;
        if (!id) return;
        const target = Array.from(overlayLayer.children).find((el) => el.dataset.id === id);
        if (!target) return;
        target.classList.add('selected');
        selectedHotspot = target;
        if (scrollIntoView && window.matchMedia('(max-width: 768px)').matches) {
          target.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
        }
      }

      /* ---------- Sidebar tabs ---------- */
      function switchSidebarTab(tabName) {
        const showArticles = tabName === 'articles';
        $('articlesTab').classList.toggle('active', showArticles);
        $('contributorsTab').classList.toggle('active', !showArticles);
        $('tabArticlesBtn').classList.toggle('active', showArticles);
        $('tabContributorsBtn').classList.toggle('active', !showArticles);
      }

      /* ---------- Modals ---------- */
      function openStudentModal(student) {
        $('modalStudentName').textContent = student.name || 'Student Name';
        $('modalStudentRole').textContent = student.role || 'Contributor';
        $('modalStudentDept').textContent = student.department || 'Department of Zoology';
        $('modalStudentWork').textContent = student.work ? 'Contribution: ' + student.work : '';
        $('modalStudentBio').textContent = student.bio || 'Editorial team member contributing to the department wall magazine edition.';

        const avatar = $('modalStudentAvatar');
        avatar.onerror = () => { avatar.onerror = null; avatar.src = PLACEHOLDER(140, 165, 'Photo'); };
        avatar.src = getPhotoUrl(student, 140, 165);

        $('studentModalBackdrop').style.display = 'flex';
      }

      function closeStudentModal() { $('studentModalBackdrop').style.display = 'none'; }

      function openArticle(art) {
        $('modalTitle').textContent = art.title || '';
        $('modalBody').textContent = art.body || art.summary || '';
        $('modalAuthor').textContent = art.author || 'Contributor';
        $('readerDrawer').style.display = 'block';
        $('readerDrawer').scrollTop = 0;
      }

      function closeDrawer() {
        $('readerDrawer').style.display = 'none';
        highlightHotspot(null);
      }

      function closeAllModals() {
        closeDrawer();
        closeStudentModal();
      }

      /* ---------- Lens (mouse + touch + pen) ---------- */
      function moveLens(e) {
        if (!lensMode) return;
        const stageRect = stage.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();
        const size = lens.offsetWidth;
        const half = size / 2;
        const zoom = 2.2;
        const isTouch = e.pointerType === 'touch';

        const inside = e.clientX >= imgRect.left && e.clientX <= imgRect.right &&
                       e.clientY >= imgRect.top && e.clientY <= imgRect.bottom;
        if (!inside) { lens.style.display = 'none'; return; }

        const x = e.clientX - stageRect.left + stage.scrollLeft;
        const y = e.clientY - stageRect.top + stage.scrollTop;
        const offsetY = isTouch ? size + 24 : half;

        lens.style.display = 'block';
        lens.style.left = (x - half) + 'px';
        lens.style.top = Math.max(stage.scrollTop, y - offsetY) + 'px';

        const bgX = -((e.clientX - imgRect.left) * zoom - half);
        const bgY = -((e.clientY - imgRect.top) * zoom - half);

        lens.style.backgroundImage = `url("${img.currentSrc || img.src}")`;
        lens.style.backgroundSize = `${imgRect.width * zoom}px ${imgRect.height * zoom}px`;
        lens.style.backgroundPosition = `${bgX}px ${bgY}px`;
      }

      function hideLens() { lens.style.display = 'none'; }

      function toggleMode() {
        lensMode = !lensMode;
        modeBtn.textContent = lensMode ? '🔍 Lens: On' : '🔍 Lens: Off';
        modeBtn.classList.toggle('active', lensMode);
        stage.classList.toggle('lens-on', lensMode);
        overlayLayer.style.display = lensMode ? 'none' : 'block';
        if (!lensMode) hideLens();
      }

      /* ---------- Events ---------- */
      yearSelect.addEventListener('change', (e) => loadMagazineEdition(e.target.value));
      modeBtn.addEventListener('click', toggleMode);
      $('resetBtn').addEventListener('click', () => {
        closeAllModals();
        if (lensMode) toggleMode();
        stage.scrollTo({ top: 0, left: 0 });
      });
      $('tabArticlesBtn').addEventListener('click', () => switchSidebarTab('articles'));
      $('tabContributorsBtn').addEventListener('click', () => switchSidebarTab('contributors'));
      $('studentCloseBtn').addEventListener('click', closeStudentModal);
      $('drawerCloseBtn').addEventListener('click', closeDrawer);
      $('studentModalBackdrop').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeStudentModal();
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });

      stage.addEventListener('pointermove', moveLens);
      stage.addEventListener('pointerdown', moveLens);
      stage.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') hideLens(); });
      stage.addEventListener('pointercancel', hideLens);
      stage.addEventListener('pointerleave', hideLens);

      initApp();
    })();
  </script>
</body>
</html>
